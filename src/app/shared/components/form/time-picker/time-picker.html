@if (label) {
  <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">
    {{ label }}
  </label>
}

<div #containerRef class="relative inline-flex items-center">
  <input
    #timeInput
    type="text"
    [id]="id"
    [placeholder]="placeholder"
    [disabled]="disabled"
    readonly
    class="cursor-pointer font-mono select-none transition-colors"
    [ngClass]="className || ('h-9 w-28 rounded-lg border bg-white px-2.5 py-1 pr-7 text-xs font-medium text-gray-800 shadow-xs dark:bg-gray-900 dark:text-white ' + (isOpen ? 'border-brand-500 ring-2 ring-brand-500/20 dark:border-brand-500' : 'border-gray-300 hover:border-gray-400 dark:border-white/10 dark:hover:border-white/20'))"
    (pointerdown)="onInputPointerDown()"
    (click)="onInputClick()"
    (blur)="onTouched()"
  />

  <span class="pointer-events-none absolute right-2 text-gray-400 dark:text-gray-500">
    <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 20 20" fill="none">
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M3.04 10a6.96 6.96 0 1113.92 0 6.96 6.96 0 01-13.92 0zm6.96-8.46a8.46 8.46 0 100 16.92 8.46 8.46 0 000-16.92zm0 9.21a.75.75 0 01-.75-.75V5.42a.75.75 0 011.5 0v3.83h2.58a.75.75 0 010 1.5H10z"
      />
    </svg>
  </span>
</div>
