<div class="relative" [class.pointer-events-none]="disabled()">
  <button
    #triggerRef
    type="button"
    class="h-11 w-full rounded-lg border appearance-none px-4 py-2.5 text-sm shadow-theme-xs text-left focus:outline-hidden focus:ring-3 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
    [ngClass]="buttonClasses()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-disabled]="disabled()"
    [title]="selectedPath || placeholder()"
    (click)="toggle()"
    (blur)="onTouched()"
  >
    <span
      class="block truncate"
      [ngClass]="selectedLabel ? 'text-gray-800 dark:text-white/90' : 'text-gray-400 dark:text-gray-400'"
    >
      {{ selectedLabel || placeholder() }}
    </span>

    <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2">
      <app-icon name="chevronDown" size="xs"/>
    </span>
  </button>

  @if (isOpen()) {
    <div
      class="fixed z-100000 flex flex-col rounded-xl border border-gray-200 bg-white shadow-theme-lg dark:border-gray-800 dark:bg-gray-900"
      [ngClass]="panelClassName()"
      [ngStyle]="panelStyles()"
    >
      @if (enableSearch()) {
        <div class="border-b border-gray-100 p-2 dark:border-gray-800">
          <input
            type="text"
            class="h-10 w-full rounded-lg border focus:border-brand-300 bg-transparent px-3 text-sm text-gray-800 placeholder:text-gray-400 focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:text-white/90 dark:placeholder:text-white/30"
            [placeholder]="searchPlaceholder()"
            [value]="query()"
            (input)="onQueryInput($event)"
            (keydown.escape)="close()"
          />
        </div>
      }

      <div class="flex-1 overflow-y-auto py-1">
        @if (flatDisplayNodes.length === 0) {
          <div class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400">
            {{ emptyText() }}
          </div>
        } @else {
          @for (node of flatDisplayNodes; track node.id) {
            <button
              type="button"
              class="flex w-full items-center justify-between py-2 pr-3 text-left text-sm"
              [style.padding-left]="'calc(0.75rem + ' + (node.level * 1.25) + 'rem)'"
              [disabled]="node.disabled"
              [ngClass]="
                node.disabled
                  ? 'cursor-not-allowed opacity-50 text-gray-400 dark:text-gray-500'
                  : node.selectable
                    ? node.id === value()
                      ? 'bg-gray-50 text-gray-900 hover:bg-gray-50 dark:bg-gray-800/60 dark:text-white dark:hover:bg-gray-800/60'
                      : 'text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-gray-800/60'
                    : 'font-semibold text-gray-800 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-gray-800/60'
              "
              (click)="onNodeClick(node)"
            >
              <div class="flex min-w-0 items-center gap-2">
                @if (node.hasChildren) {
                  <span
                    class="inline-flex size-4 shrink-0 items-center justify-center text-gray-400 hover:text-gray-700 dark:text-gray-500 dark:hover:text-gray-200"
                    (click)="toggleNode(node.id, $event)"
                  >
                    @if (node.expanded) {
                      <app-icon name="chevronDown" size="xs" />
                    } @else {
                      <app-icon name="chevronRight" size="xs" />
                    }
                  </span>
                } @else if (node.level > 0) {
                  <span class="inline-block size-4 shrink-0"></span>
                }

                <span
                  class="truncate"
                  [ngClass]="{
                    'font-semibold text-gray-900 dark:text-white': !node.selectable && node.level === 0,
                    'font-medium text-gray-800 dark:text-gray-200': !node.selectable && node.level > 0,
                    'font-normal': node.selectable
                  }"
                >
                  {{ node.label }}
                </span>
              </div>

              @if (node.selectable && node.id === value()) {
                <svg
                  width="1em"
                  height="1em"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  class="size-5 shrink-0 fill-brand-500"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M16.7042 5.29584C17.0947 5.68637 17.0947 6.31953 16.7042 6.71006L8.70418 14.7101C8.31366 15.1006 7.68049 15.1006 7.28997 14.7101L3.29584 10.7159C2.90532 10.3254 2.90532 9.69225 3.29584 9.30172C3.68637 8.9112 4.31953 8.9112 4.71006 9.30172L7.99707 12.5887L15.2899 5.29584C15.6805 4.90532 16.3137 4.90532 16.7042 5.29584Z"
                  />
                </svg>
              }
            </button>
          }
        }
      </div>
    </div>
  }
</div>
