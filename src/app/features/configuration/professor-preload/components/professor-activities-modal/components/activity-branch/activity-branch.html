@if (nodes().length) {
  <div class="flex flex-col gap-3">
    @for (node of nodes(); track node.id) {
      @if (node.hijos.length) {
        <section class="flex flex-col gap-2">
          <h5 class="text-sm font-semibold text-gray-800 dark:text-white/90">
            {{ node.nombre }}
          </h5>
          <div class="border-l border-gray-200 pl-4 dark:border-white/10">
            <app-activity-branch [nodes]="node.hijos" />
          </div>
        </section>
      } @else {
        <article class="rounded-xl border border-gray-200 px-4 py-3 dark:border-white/10">
          <p class="text-sm font-medium text-gray-800 dark:text-white/90">
            {{ node.nombre }}
          </p>
          @if (node.descripcion && node.descripcion !== node.nombre) {
            <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
              {{ node.descripcion }}
            </p>
          }
        </article>
      }
    }
  </div>
} @else {
  <p class="text-sm text-gray-500 dark:text-gray-400">
    {{ emptyLabel() }}
  </p>
}
