<div [class]="listClass()">
  @for (node of nodes(); track node.id) {
    @if (depth() === 0) {
      <section class="flex flex-col gap-3">
        @let icon = sectionIcon(node);
        <div class="flex items-center gap-3">
          <span
            class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl {{
              icon.badgeClass
            }}"
          >
            <app-icon [name]="icon.name" size="sm" [classes]="icon.iconClass" />
          </span>
          <h4
            class="min-w-0 flex-1 text-sm font-semibold uppercase tracking-wide text-gray-800 dark:text-white/90"
          >
            {{ node.nombre }}
          </h4>
          <div class="ml-auto shrink-0">
            <ng-content select="[activityTreeActions]" />
          </div>
        </div>
        <div class="flex flex-col gap-3">
          @if (hasChildren(node)) {
            <app-activity-tree
              class="block"
              [nodes]="node.hijos"
              [depth]="depth() + 1"
              [idCoordinacion]="idCoordinacion()"
              [idUnidadRegional]="idUnidadRegional()"
              [idPeriodoUniversidad]="idPeriodoUniversidad()"
              [idConvocatoria]="idConvocatoria()"
              [idCargaDocente]="idCargaDocente()"
              [savedDetails]="savedDetails()"
              (detailSaved)="detailSaved.emit()"
            />
          } @else {
            <app-activity-card
              class="block"
              [activity]="node"
              [idCoordinacion]="idCoordinacion()"
              [idUnidadRegional]="idUnidadRegional()"
              [idPeriodoUniversidad]="idPeriodoUniversidad()"
              [idConvocatoria]="idConvocatoria()"
              [idCargaDocente]="idCargaDocente()"
              [savedDetails]="savedDetails()"
              (detailSaved)="detailSaved.emit()"
            />
          }
        </div>
      </section>
    } @else if (hasChildren(node)) {
      <section class="flex flex-col gap-3">
        <h5 class="text-xs font-semibold uppercase tracking-wide text-gray-600 dark:text-gray-300">
          {{ node.nombre }}
        </h5>
        <app-activity-tree
          class="block"
          [nodes]="node.hijos"
          [depth]="depth() + 1"
          [idCoordinacion]="idCoordinacion()"
          [idUnidadRegional]="idUnidadRegional()"
          [idPeriodoUniversidad]="idPeriodoUniversidad()"
          [idConvocatoria]="idConvocatoria()"
          [idCargaDocente]="idCargaDocente()"
          [savedDetails]="savedDetails()"
          (detailSaved)="detailSaved.emit()"
        />
      </section>
    } @else {
      <app-activity-card
        class="block"
        [activity]="node"
        [idCoordinacion]="idCoordinacion()"
        [idUnidadRegional]="idUnidadRegional()"
        [idPeriodoUniversidad]="idPeriodoUniversidad()"
        [idConvocatoria]="idConvocatoria()"
        [idCargaDocente]="idCargaDocente()"
        [savedDetails]="savedDetails()"
        (detailSaved)="detailSaved.emit()"
      />
    }
  }
</div>
