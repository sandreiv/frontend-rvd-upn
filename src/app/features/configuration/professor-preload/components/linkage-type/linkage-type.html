<section
  class="mt-4 rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/3 lg:p-6"
>
  @if (isLoadingLinkageTypes() && !hasAnyLinkageType()) {
    <p
      class="border-b border-gray-200 pb-3 text-sm text-gray-500 dark:border-white/10 dark:text-gray-400"
    >
      Cargando tipos de vinculación...
    </p>
  } @else if (hasAnyLinkageType()) {
    <app-tab-bar
      [items]="linkageTypeTabs()"
      [selectedId]="selectedLinkageTypeId()"
      (selectedIdChange)="onLinkageTypeChange($event)"
    />
  } @else {
    <p
      class="border-b border-gray-200 pb-3 text-sm text-gray-500 dark:border-white/10 dark:text-gray-400"
    >
      Asigne tipos de vinculación para la convocatoria.
    </p>
  }
  @if (hasAnyLinkageType()) {
    <div class="mt-4">
      <app-button
        type="button"
        size="sm"
        className="h-11 shrink-0 whitespace-nowrap"
        (btnClick)="onProfessorAddModalOpen()"
      >
        <app-icon name="plus" size="sm" />
        Agregar docente
      </app-button>
    </div>
  }
</section>

<app-professor-add-modal
  [isOpen]="isProfessorAddModalOpen()"
  [anio]="coordination().anioUniversidad"
  [linkageType]="selectedLinkageType()"
  (close)="closeProfessorAddModal()"
/>
