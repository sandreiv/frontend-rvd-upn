<div class="grid gap-4">
  <div class="min-w-0">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
          Preasignación de horas académicas
        </h3>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Asigna materias y carga horaria a los docentes del período activo.
        </p>
      </div>

      <app-button
        type="button"
        size="sm"
        variant="outline"
        (btnClick)="back.emit()"
      >
        Volver al listado
      </app-button>
    </div>

    <div class="mt-4 grid grid-cols-1 items-stretch gap-4 lg:grid-cols-2">
      <app-coordination-summary
        class="block h-full min-w-0"
        [coordination]="coordination()"
      />
      <app-total-coordination class="block h-full min-w-0" />
    </div>

    <app-linkage-type [coordination]="coordination()" />

  </div>
</div>
