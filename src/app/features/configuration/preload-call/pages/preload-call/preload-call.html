<div
  class="grid gap-4"
  [class.lg:grid-cols-2]="showPreloadCallForm()"
>
  <div class="min-w-0">
    <app-section-frame
      title="Convocatorias"
      description="Administra las convocatorias del sistema."
      iconName="call"
      iconVariant="brand"
    >
      <div sectionFrameHeaderActions class="flex items-center gap-3">
        <app-select
          class="w-full sm:w-72"
          labelFormat="none"
          [options]="universityPeriodOptions()"
          [value]="selectedUniversityPeriodId()"
          (valueChange)="selectedUniversityPeriodId.set($event)"
          placeholder="Seleccione el periodo"
          searchPlaceholder="Buscar periodo..."
          emptyText="No se encontraron periodos"
        />
        <app-button
          variant="primary"
          [disabled]="!selectedUniversityPeriodId() || isLoading()"
          (btnClick)="onFilterByPeriod()"
        >
          Filtrar
        </app-button>
        @if (activeFilterPeriodId() != null) {
          <app-button
            variant="outline"
            (btnClick)="onClearFilter()"
          >
            Limpiar
          </app-button>
        }
      </div>

      <app-preload-call-table
        [preloadCalls]="preloadCalls()"
        [selectedPreloadCallIds]="selectedPreloadCallIds()"
        [emptyMessage]="tableEmptyMessage()"
        [showLinkCallAction]="true"
        (selectedPreloadCallIdsChange)="onSelectedPreloadCallIdsChange($event)"
        (addPreloadCall)="openPreloadCallForm()"
        (editPreloadCall)="openEditPreloadCallForm($event)"
        (deletePreloadCall)="onDeletePreloadCall($event)"
        (refreshPreloadCall)="onRefreshPreloadCallList()"
        (deleteAllPreloadCall)="onDeleteAllPreloadCall($event)"
        (linkPreloadCall)="openLinkPreloadCallModal($event)"
      />
    </app-section-frame>
  </div>

  @if (showPreloadCallForm()) {
    <div class="min-w-0">
      <app-section-frame
        [title]="formMode() === 'edit'
          ? 'Editar convocatoria'
          : 'Formulario de convocatoria'"
        description="Complete los datos de la convocatoria."
        iconName="plus"
        iconVariant="brand"
      >
        <app-preload-call-form
          [preloadCall]="selectedPreloadCall()"
          [mode]="formMode()"
          [isSaving]="isSaving()"
          (closeForm)="closePreloadCallForm()"
          (submitPreloadCall)="onSubmitPreloadCall($event)"
        />
      </app-section-frame>
    </div>
  }
</div>

<app-link-preload-call-modal
  [isOpen]="isLinkModalOpen()"
  [linkKind]="linkKind()"
  [preloadCall]="preloadCallToLink()"
  [calls]="linkModalCalls()"
  [isLoadingOptions]="isLoadingLinkOptions()"
  [isSaving]="isSavingLink()"
  (close)="closeLinkModal()"
  (save)="onSaveLink($event)"
  (unlink)="onUnlink()"
/>

<app-new-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="deleteModalTitle()"
  [message]="deleteModalMessage()"
  [buttonText]="deleteModalButtonText()"
  [showCancelButton]="true"
  cancelButtonText="Cancelar"
  variant="danger"
  (confirm)="confirmDelete()"
  (close)="closeDeleteModal()"
/>
