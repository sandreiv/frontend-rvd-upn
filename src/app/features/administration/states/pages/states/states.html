<app-section-frame
  title="Estados"
  description="Administra los estados utilizados en los diferentes procesos del sistema."
  iconName="adjustmentsHorizontal"
  iconVariant="brand"
>

  <div>

    <!-- Formulario de creación y edición -->
    @if (showForm()) {

      <app-states-form
        [state]="selectedState()"
        [isSaving]="isSaving()"
        (cancel)="closeForm()"
        (saveState)="onSaveState($event)"
      />

    <!-- Formulario de estados siguientes -->
    } @else if (nextStatesOrigin(); as origin) {

      <app-next-states-form
        [originState]="origin"
        [states]="states()"
        [initialNextStates]="initialNextStates()"
        [isLoading]="isLoadingNextStates()"
        [isSaving]="isSavingNextStates()"
        [canSave]="nextStatesLoaded()"
        [errorMessage]="nextStatesError()"
        (cancel)="closeNextStatesForm()"
        (saveNextStates)="onSaveNextStates($event)"
      />

    <!-- Tabla principal -->
    } @else {

      <app-states-table
        [states]="states()"
        [selectedStateIds]="selectedStateIds()"
        (selectedStateIdsChange)="onSelectedIdsChange($event)"
        (refreshStates)="refreshStates()"
        (addState)="openCreateForm()"
        (editState)="openEditForm($event)"
        (nextStates)="openNextStatesForm($event)"
        (deleteState)="requestDeleteState($event)"
        (deleteAll)="requestBulkDelete($event)"
      />

    }

  </div>

</app-section-frame>

<app-new-modal
  [isOpen]="showDeleteModal()"
  [title]="deleteModalTitle()"
  [message]="deleteModalMessage()"
  [buttonText]="deleteModalButtonText()"
  [showCancelButton]="true"
  cancelButtonText="No, cancelar"
  (confirm)="confirmDelete()"
  (close)="closeDeleteModal()"
/>
