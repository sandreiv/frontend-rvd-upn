<app-section-frame
  title="Tipo actividades"
  description="Administra las actividades principales usadas en la precarga docente."
  iconName="bookOpen"
  iconVariant="brand"
>
  <div class="space-y-5">
    @if (showForm()) {
      <app-activity-type-form
        [activityType]="selectedActivityType()"
        [allActivityTypes]="activityTypes()"
        [title]="formTitle()"
        [editTitle]="formEditTitle()"
        [description]="formDescription()"
        [isSaving]="isSaving()"
        [parentMinHoras]="parentMinHoras()"
        [parentMaxHoras]="parentMaxHoras()"
        [siblingsMaxHoursSum]="siblingsMaxHoursSum()"
        (cancel)="closeForm()"
        (saveActivityType)="onSaveActivityType($event)"
      />
    } @else {
      <app-activity-type-table
        [activityTypes]="activityTypes()"
        [selectedActivityTypeIds]="selectedActivityTypeIds()"
        emptyMessage="No hay tipos de actividades registrados."
        searchPlaceholder="Buscar tipo de actividad..."
        (selectedActivityTypeIdsChange)="selectedActivityTypeIds.set($event)"
        (addActivityType)="openCreateRootForm()"
        (addChildActivityType)="openCreateChildForm($event)"
        (editActivityType)="openEditForm($event)"
        (deleteActivityType)="requestDeleteActivityType($event)"
        (deleteAll)="requestBulkDelete($event)"
        (refreshActivityTypes)="refreshActivityTypes()"
      />
    }
  </div>
</app-section-frame>

<app-new-modal
  [isOpen]="showDeleteModal()"
  [title]="deleteModalTitle()"
  [message]="deleteModalMessage()"
  [buttonText]="isDeleting() ? 'Eliminando...' : 'Sí, eliminar'"
  [showCancelButton]="true"
  cancelButtonText="No, cancelar"
  (confirm)="confirmDelete()"
  (close)="closeDeleteModal()"
/>
