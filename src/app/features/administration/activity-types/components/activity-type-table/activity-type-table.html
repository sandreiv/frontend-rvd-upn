<app-tree-table
  [columns]="columns"
  [rows]="activityTypes()"
  [rowActions]="rowActions()"
  [enableSelection]="true"
  [enableBulkActions]="true"
  [showDeleteButton]="true"
  [selectedRowKeys]="selectedActivityTypeIds()"
  (selectedRowKeysChange)="onSelectedIdsChange($event)"
  (selectedIdsChange)="selectedActivityTypeIds.set($event)"
  [emptyMessage]="emptyMessage()"
  [searchPlaceholder]="searchPlaceholder()"
  (add)="addActivityType.emit()"
  (refresh)="refreshActivityTypes.emit()"
  (deleteAll)="deleteAll.emit($event)"
  (action)="onAction($event)"
/>
