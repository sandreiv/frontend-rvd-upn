<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="rounded-xl border border-gray-200 bg-white p-4 dark:border-white/10 dark:bg-white/3"
>
  <div class="mb-4 flex flex-col gap-1">
    <h4 class="text-sm font-semibold text-gray-900 dark:text-white">
      {{ project() ? editTitle() : title() }}
    </h4>
    <p class="text-xs text-gray-500 dark:text-gray-400">
      {{ description() }}
    </p>
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div>
      <app-label>Nombre del proyecto</app-label>
      <app-input-field formControlName="nombre" placeholder="Ingrese el nombre del proyecto" />
    </div>

    <div>
      <app-label>Acta de consejo</app-label>
      <app-input-field
        formControlName="actaConsejo"
        placeholder="Acta de consejo del proyecto"
      />
    </div>
  </div>

  <div class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div>
      <app-label>Tipo de actividad</app-label>
      <fieldset class="m-0 min-w-0 border-0 p-0" [disabled]="isProductMode()">
        <app-tree-select
          formControlName="idTipoActividad"
          [items]="rawTipoActividades()"
          valueKey="id"
          labelKey="nombre"
          parentKey="idPadre"
          selectableKey="esSeleccionable"
          placeholder="Seleccione tipo de actividad"
          searchPlaceholder="Buscar actividad..."
          [disabled]="isProductMode()"
        />
      </fieldset>
    </div>

    <div>
      <app-label>Coordinación</app-label>
      <fieldset class="m-0 min-w-0 border-0 p-0" [disabled]="isProductMode()">
        <app-typeahead-select
          formControlName="idCoordinacion"
          [items]="filteredCoordinations()"
          [optionAdapter]="coordinationOptionAdapter"
          [disabled]="isProductMode()"
          placeholder="Buscar coordinación"
          emptyText="No se encontraron resultados"
          (queryChange)="onSearchCoordination($event)"
        />
      </fieldset>
    </div>
  </div>

  <div class="mt-4">
    <app-label>Descripción</app-label>
    <app-input-field
      formControlName="descripcion"
      placeholder="Ingrese la descripción del proyecto"
    />
  </div>

  <div class="mt-5 flex justify-end gap-3">
    <app-button
      type="button"
      variant="outline"
      size="sm"
      (btnClick)="cancel.emit()"
    >
      Cancelar
    </app-button>
    <app-button type="submit" size="sm" [disabled]="form.invalid || isSaving()">
      {{ isSaving() ? 'Guardando...' : 'Guardar' }}
    </app-button>
  </div>
</form>
